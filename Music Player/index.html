<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>

    <!-- Main CSS File -->
    <link rel="stylesheet" href="./index.css" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body data-theme="light">
    <!-- ================= HEADER ================= -->
    <header class="app-header">
      <!-- Theme Toggle -->
      <div class="theme-toggle">
        <span>🌞</span>
        <label class="switch">
          <input type="checkbox" id="theme-switch" />
          <span class="slider"></span>
        </label>
        <span>🌙</span>
      </div>

      <!-- App Title -->
      <h1 class="app-title">🎵 Music Player</h1>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="app-container">
      <!-- ===== SONG LIBRARY ===== -->
      <section class="song-library">
        <!-- Genre Filter -->
        <div class="genre-filter">
          <label for="genre-select">🎧 Filter by Genre</label>
          <select id="genre-select">
            <option value="all">All</option>
            <option value="pop">Pop</option>
            <option value="rock">Rock</option>
            <option value="classical">Classical</option>
          </select>
        </div>

        <!-- All Songs List -->
        <h2>All Songs</h2>
        <div class="songs-list">
          <!-- Songs rendered using JavaScript -->
        </div>
      </section>

      <!-- ===== PLAYER CARD ===== -->
      <section class="player-card">
        <!-- Song Info -->
        <img id="song-img" alt="Song cover" />
        <h2 id="song-title">Song Title</h2>
        <p id="song-artist">Artist Name</p>

        <!-- Audio Player -->
        <audio id="audio-player" controls></audio>

        <!-- Player Controls -->
        <div class="player-controls">
          <button id="prev-btn" title="Previous">
            <i class="fa fa-backward"></i>
          </button>

          <button id="add-playlist-btn" title="Add to Playlist">
            <i class="fa fa-plus"></i>
          </button>

          <button id="next-btn" title="Next">
            <i class="fa fa-forward"></i>
          </button>
        </div>
      </section>

      <!-- ===== PLAYLIST PANEL ===== -->
      <section class="playlist-panel">
        <!-- Search Playlist -->
        <input
          type="text"
          id="search-playlist"
          placeholder="Search in playlist..."
        />

        <!-- Create Playlist -->
        <input
          type="text"
          id="new-playlist-name"
          placeholder="New playlist name"
        />
        <button id="create-playlist-btn">Create</button>

        <!-- Current Playlist -->
        <h2>Current Playlist</h2>
        <div class="current-playlist"></div>

        <!-- All Playlists -->
        <h2>All Playlists</h2>
        <div class="all-playlists"></div>
      </section>
    </main>

    <!-- Main JavaScript -->
    <script src="./script.js"></script>
  </body>
</html>
