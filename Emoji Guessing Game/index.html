<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Guessing Game</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>🎯 Emoji Guessing Game</h1>
      <div class="top-bar">
        <span id="score">Score: 0</span>
        <span id="timer">⏱️ 5s</span>
      </div>

      <div id="gameUI">
        <div class="emoji-box">
          <i id="emojiIcon" class="fa-solid"></i>
        </div>

        <input
          type="text"
          id="guessInput"
          placeholder="Guess the emoji meaning..."
          autocomplete="off"
        />

        <button id="submitBtn">Guess</button>

        <p id="hint-text"></p>
        <p id="message"></p>
      </div>

      <div id="resultScreen" class="result-screen hidden">
        <h2>🎉 Game Over</h2>
        <p id="finalScore"></p>
        <button class="playAgain">Play Again</button>
      </div>
    </div>

    <script src="emojiGame.js"></script>
  </body>
</html>
